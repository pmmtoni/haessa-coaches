{% extends "base.html" %}
{% block title %}Edit Task Template{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-white">
            <h4 class="mb-0">Edit Task Template</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Coach Type</label>
                        <input type="text" name="coach_type" class="form-control" value="{{ template.coach_type }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phase</label>
                        <input type="text" name="phase" class="form-control" value="{{ template.phase }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Section</label>
                        <input type="text" name="section" class="form-control" value="{{ template.section }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Task</label>
                        <input type="text" name="task" class="form-control" value="{{ template.task }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Hours</label>
                        <input type="number" step="0.1" name="hours" class="form-control" value="{{ template.hours }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Sort Order</label>
                        <input type="number" name="sort_order" class="form-control" value="{{ template.sort_order }}">
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                   {% if template.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Update</button>
                    <a href="{{ url_for('task_templates_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
