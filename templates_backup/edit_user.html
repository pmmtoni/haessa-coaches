{% extends "base.html" %}
{% block title %}Edit User{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-warning py-3">
            <h4 class="mb-0">Edit User</h4>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <input
                        id="username"
                        name="username"
                        class="form-control"
                        value="{{ user.username }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">Role</label>
                    <select id="role" name="role" class="form-select">
                        <option value="viewer" {% if user.role == 'viewer' %}selected{% endif %}>Viewer</option>
                        <option value="editor" {% if user.role == 'editor' %}selected{% endif %}>Editor</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>

                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="is_active_user"
                        name="is_active_user"
                        {% if user.is_active_user %}checked{% endif %}
                    >
                    <label class="form-check-label" for="is_active_user">Active User</label>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">New Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        class="form-control"
                        placeholder="Leave blank to keep current password"
                    >
                </div>

                <hr>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Created At</label>
                        <input class="form-control" value="{{ user.created_at.strftime('%Y-%m-%d %H:%M') if user.created_at else '—' }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Created By</label>
                        <input class="form-control" value="{{ user.created_by or '—' }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Updated At</label>
                        <input class="form-control" value="{{ user.updated_at.strftime('%Y-%m-%d %H:%M') if user.updated_at else '—' }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Updated By</label>
                        <input class="form-control" value="{{ user.updated_by or '—' }}" disabled>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button class="btn btn-warning" type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
