<nav class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3" aria-label="Dependency Gantt pages">
    <span class="small text-muted">{{ pagination.total }} tasks · Page {{ pagination.page }} of {{ pagination.pages or 1 }} · Up to 20 tasks per page. Timeline and counts cover this page.</span>
    <div class="btn-group">
        {% if pagination.has_prev %}
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('production_dependency_gantt', coach_id=coach.id, page=pagination.prev_num) }}">Previous</a>
        {% endif %}
        {% if pagination.has_next %}
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('production_dependency_gantt', coach_id=coach.id, page=pagination.next_num) }}">Next</a>
        {% endif %}
    </div>
</nav>
